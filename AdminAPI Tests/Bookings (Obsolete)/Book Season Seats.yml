info:
  name: Book Season Seats
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/bookings/season/book-season"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "seasonKey": "{{seasonExternalKey}}",
        "seats": { "B-9-1": 75.00, "B-9-2": 75.00 },
        "holdToken": null,
        "ticketType": "SeasonPass",
        "clientContact": {
          "fullName": "Obsolete Season Test User",
          "email": "obsolete-season-test@example.com"
        },
        "paymentInfoRequest": {
          "cashAmount": 150.00
        },
        "localizer": null
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", () => {
          expect(res.status).to.equal(200);
        });
        test("bookingId is null (never set by handler)", () => {
          expect(res.body.bookingId).to.equal(null);
        });
        test("reference is null (never set by handler)", () => {
          expect(res.body.reference).to.equal(null);
        });
        test("localizer is set", () => {
          expect(res.body.localizer).to.be.a("string");
          expect(res.body.localizer.length).to.be.greaterThan(0);
        });
        test("tickets is array of seat keys", () => {
          expect(res.body.tickets).to.be.an("array");
          expect(res.body.tickets.length).to.equal(2);
        });
        test("message is set", () => {
          expect(res.body.message).to.equal("Booking created successfully");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
