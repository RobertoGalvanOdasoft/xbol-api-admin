info:
  name: Create Season Validation Error EN
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/seasons"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept-Language
      value: en
  body:
    type: json
    data: "{}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", () => {
          expect(res.status).to.equal(400);
        });
        test("content-type is application/problem+json", () => {
          expect(res.headers["content-type"]).to.contain("application/problem+json");
        });
        test("title is in English", () => {
          expect(res.body.title).to.contain("validation errors");
        });
        test("has validation errors for required fields", () => {
          expect(res.body.errors.Name).to.be.an("array");
          expect(res.body.errors.Code).to.be.an("array");
          expect(res.body.errors.StartDate).to.be.an("array");
          expect(res.body.errors.EndDate).to.be.an("array");
        });
        test("error messages are in English", () => {
          expect(res.body.errors.Name[0]).to.contain("Name");
          expect(res.body.errors.Code[0]).to.contain("Code");
          expect(res.body.errors.StartDate[0]).to.contain("Start Date");
          expect(res.body.errors.EndDate[0]).to.contain("End Date");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
