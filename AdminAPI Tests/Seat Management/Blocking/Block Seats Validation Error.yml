info:
  name: Block Seats Validation Error
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/seat-management/{{scheduleExternalKey}}/block"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept-Language
      value: es
  body:
    type: json
    data: "{}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", () => {
          expect(res.status).to.equal(400);
        });
        test("content-type is application/problem+json", () => {
          expect(res.headers["content-type"]).to.contain("application/problem+json");
        });
        test("is ValidationProblemDetails with errors object", () => {
          expect(res.body.errors).to.be.an("object");
        });
        test("title is localized in Spanish", () => {
          expect(res.body.title).to.contain("validación");
        });
        test("has validation errors for required fields", () => {
          expect(res.body.errors.SeatKeys).to.be.an("array");
          expect(res.body.errors.Reason).to.be.an("array");
          expect(res.body.errors.Color).to.be.an("array");
        });
        test("error messages are localized", () => {
          expect(res.body.errors.SeatKeys[0]).to.contain("Claves de Asientos");
          expect(res.body.errors.Reason[0]).to.contain("Razón");
          expect(res.body.errors.Color[0]).to.contain("Color");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
