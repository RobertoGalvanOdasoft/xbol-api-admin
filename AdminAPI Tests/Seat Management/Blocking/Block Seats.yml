      value: application/json
  body:
    type: json
    data: |-
      {
        "seatKeys": ["{{blockSeat1}}", "{{blockSeat2}}", "{{blockSeat3}}"],
        "reason": "VIP hold for sponsor",
        "color": "#DAA520"
      }

runtime:
  scripts:
