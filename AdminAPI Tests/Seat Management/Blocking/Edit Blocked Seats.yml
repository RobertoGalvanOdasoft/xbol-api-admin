info:
  name: Edit Blocked Seats
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/seat-management/{{scheduleExternalKey}}/block"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "seatKeys": ["{{blockSeat1}}", "{{blockSeat2}}", "{{blockSeat3}}"],
        "reason": "Updated: executive hold",
        "color": "#FF6347"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 204", () => {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
