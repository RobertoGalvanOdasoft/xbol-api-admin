info:
  name: Verify Order
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/orders/renewal-info/{{orderReference}}"
  headers:
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", () => {
          expect(res.status).to.equal(200);
        });
        test("order exists with correct data", () => {
          expect(res.body.orderId).to.be.a("number");
          expect(res.body.orderId).to.be.greaterThan(0);
        });
        test("order has correct client email", () => {
          expect(res.body.email).to.equal("test@example.com");
        });
        test("order is not a season order", () => {
          expect(res.body.isSeasonOrder).to.equal(false);
        });
        test("order has items", () => {
          expect(res.body.items).to.be.an("array");
          expect(res.body.items.length).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
