info:
  name: Get Hold Token
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/seat-management/hold/{{holdToken}}"
  headers:
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", () => {
          expect(res.status).to.equal(200);
        });
        test("content-type is application/json", () => {
          expect(res.headers["content-type"]).to.contain("application/json");
        });
        test("response has token", () => {
          expect(res.body.token).to.be.a("string");
        });
        test("response has expiresInSeconds", () => {
          expect(res.body.expiresInSeconds).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
