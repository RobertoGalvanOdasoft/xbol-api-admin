info:
  name: Create Suite MaxLength Error
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/suites"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept-Language
      value: es
  body:
    type: json
    data: |-
      {
        "name": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
        "suiteLevelId": 1,
        "seats": 10
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", () => {
          expect(res.status).to.equal(400);
        });
        test("content-type is application/problem+json", () => {
          expect(res.headers["content-type"]).to.contain("application/problem+json");
        });
        test("has Name validation error", () => {
          expect(res.body.errors.Name).to.be.an("array");
        });
        test("Name error mentions max length in Spanish", () => {
          expect(res.body.errors.Name[0]).to.contain("exceder");
        });
        test("title is localized", () => {
          expect(res.body.title).to.contain("validación");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
