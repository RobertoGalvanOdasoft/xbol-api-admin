info:
  name: Update Suite Validation Error
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/suites/{{createdSuiteId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept-Language
      value: es
  body:
    type: json
    data: |-
      {
        "name": "",
        "suiteLevelId": 0,
        "seats": 0
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", () => {
          expect(res.status).to.equal(400);
        });
        test("content-type is application/problem+json", () => {
          expect(res.headers["content-type"]).to.contain("application/problem+json");
        });
        test("is ValidationProblemDetails with errors object", () => {
          expect(res.body.errors).to.be.an("object");
        });
        test("has Name validation error", () => {
          expect(res.body.errors.Name).to.be.an("array");
        });
        test("title is localized", () => {
          expect(res.body.title).to.contain("validación");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
